# DevMind — Render Infrastructure Blueprint (Free Profile, ADR-046)
# Deploys one free web service (API + embedded Celery) and one free Key Value instance
# Docs: docs/runbooks/deploy-render-vercel.md and docs/10-deployment-and-operations.md §22

services:
  # ---------------------------------------------------------------------------
  # 1. DevMind Web Service (FastAPI + Embedded Celery in Free Profile)
  # ---------------------------------------------------------------------------
  - type: web
    name: devmind-api
    runtime: docker
    plan: free
    region: oregon # or ohio / frankfurt (match Neon database region)
    dockerfilePath: server/Dockerfile
    dockerContext: server
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      # Core application settings
      - key: DEVMIND_ENV
        value: production
      - key: DEVMIND_RUN_MODE
        value: all # Free profile: runs uvicorn + embedded Celery worker/scheduler
      - key: DEVMIND_LOG_LEVEL
        value: INFO
      - key: DEVMIND_REDIS_KEY_PREFIX
        value: "dm:"
      - key: DEVMIND_CORS_ORIGINS
        value: https://devmind.warishlabs.in,http://localhost:3000

      # Redis connection from Render Key Value
      - key: DEVMIND_REDIS_URL
        fromService:
          type: redis
          name: devmind-redis
          property: connectionString

      # Database URLs (Neon PostgreSQL — user inputs in Render Dashboard)
      - key: DEVMIND_DATABASE_URL
        sync: false
      - key: DEVMIND_DATABASE_URL_DIRECT
        sync: false

      # Clerk Authentication
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false

      # Token Security and Encryption
      - key: DEVMIND_ENCRYPTION_KEYS
        sync: false
      - key: DEVMIND_EXT_TOKEN_PEPPER
        sync: false

      # LLM Provider (Default: fake provider for zero-cost baseline)
      - key: DEVMIND_LLM_PROVIDER
        value: fake
      - key: DEVMIND_LLM_PRIMARY_API_KEY
        sync: false
      - key: DEVMIND_EMBED_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. DevMind Key Value (Render Free Redis-compatible store)
  # ---------------------------------------------------------------------------
  - type: redis
    name: devmind-redis
    plan: free
    region: oregon # Must match web service region
    ipAllowList: [] # Internal service access only
    maxmemoryPolicy: noeviction
