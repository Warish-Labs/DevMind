name: Bug Report
description: Create a report to help us fix an issue in DevMind
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please ensure no secrets or sensitive customer code are included.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Website (client/)
        - Backend API / Celery (server/)
        - VS Code Extension (extension/)
        - Shared Core (common/)
        - Documentation / Infra
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, browser version, Node.js / Python version, etc.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS / Windows
        - Node: v24.22.0
        - Browser / VS Code Version:
