name: Feature Request
description: Suggest an idea or enhancement for DevMind
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues and ADRs before opening a new request.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Website (client/)
        - Backend API / Celery (server/)
        - VS Code Extension (extension/)
        - Shared Core (common/)
        - Documentation / Architecture
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Documentation References
      description: Any relevant links to DevMind docs (e.g. docs/01, docs/12), diagrams, or mockups.
