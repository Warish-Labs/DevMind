name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-fast:
    name: Fast Verification Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install server Python dependencies
        run: uv sync --frozen --project server

      - name: Run Fast Test Suite (13 Checks)
        run: node scripts/test-all.mjs --fast
        env:
          CI: "true"
          DEVMIND_ENV: test
          DEVMIND_RUN_MODE: all
          DEVMIND_LLM_PROVIDER: fake
          DEVMIND_EMBED_PROVIDER: fake
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_publishable_key
          NEXT_PUBLIC_FIXTURE_MODE: "true"

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ci-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check ci-fast result
        run: |
          if [ "${{ needs.ci-fast.result }}" = "success" ]; then
            echo "✓ ci-fast passed successfully. ci-gate green."
            exit 0
          else
            echo "✗ ci-fast failed or was cancelled."
            exit 1
          fi
