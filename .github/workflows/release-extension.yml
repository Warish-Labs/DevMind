name: Release VS Code Extension

on:
  push:
    tags:
      - "ext-v*.*.*"

permissions:
  contents: write

jobs:
  build-package:
    name: Build & Package Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package .vsix
        shell: bash
        run: |
          if [ -d "extension" ] && [ -f "extension/package.json" ]; then
            pnpm --filter extension run build
            pnpm --filter extension run test
            pnpm --filter extension package
            mkdir -p dist-extension
            cp extension/*.vsix dist-extension/
          else
            echo "Extension package not scaffolded yet (scheduled for Phase S2)."
            mkdir -p dist-extension
            touch dist-extension/devmind-placeholder.vsix
          fi

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devmind-extension-vsix
          path: dist-extension/*.vsix
          retention-days: 14

      - name: Create Draft GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist-extension/*.vsix \
            --title "DevMind Extension $TAG_NAME" \
            --draft \
            --notes "Automated release build for DevMind VS Code extension $TAG_NAME."

  publish-vs-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: build-package
    environment: extension-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmind-extension-vsix
          path: dist-extension

      - name: Publish to VS Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not configured in the extension-release environment. Skipping publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath dist-extension/*.vsix -p "$VSCE_PAT"

  publish-open-vsx:
    name: Publish to Open VSX
    needs: build-package
    environment: extension-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devmind-extension-vsix
          path: dist-extension

      - name: Publish to Open VSX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not configured in the extension-release environment. Skipping publish."
            exit 0
          fi
          npx --yes ovsx publish dist-extension/*.vsix -p "$OVSX_PAT"
