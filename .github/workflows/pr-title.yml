name: PR Title Check

on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR Title Format
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Inspecting PR Title: $PR_TITLE"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?: .+"
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::PR Title '$PR_TITLE' does not follow Conventional Commits standard."
            echo "Expected format: <type>(<scope>): <description> or <type>: <description>"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✓ PR Title follows Conventional Commits format."
